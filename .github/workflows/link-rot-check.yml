name: Link rot check
# Website tooling, largely written by AI (Claude) and checked for behaviour
# rather than wording. It describes how the site is built, not how the lab works;
# lab policy lives in _guide/. See accessibility.md, "How this site is made".

# Once a year, verify every OUTBOUND link the data files depend on still works:
# paper DOIs, "In the news" press & media URLs, and the data/code/preprint/
# open-access links attached to papers (_data/publications.yml, publications_manual.yml,
# pub_links.yml, press.yml, media.yml). These point at publishers and news sites that
# quietly move or delete pages; the internal Site checks can't see that.
#
# Only genuinely dead links (HTTP 404/410 or an unreachable host) open an issue;
# publisher/news bot-blocks (403/429) are reported as "couldn't verify", not failures.
# Run it any time from the Actions tab ("Run workflow").
on:
  schedule:
    # Quarterly, offset from the guide link sweep so the two don't collide.
    - cron: "0 8 19 1,4,7,10 *"   # 19 Jan / Apr / Jul / Oct, 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-outbound-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check DOIs, press, and resource links
        id: check
        continue-on-error: true   # a failure here means "broken links found"; the issue is the alert
        run: python scripts/check_links.py --out link-report.md

      - name: Open or update the issue listing the broken links
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/upsert_issue.sh \
            "link-rot-outbound" \
            "Broken outbound links (DOIs, press, resources)" \
            ./link-report.md \
            "Dead publisher/press/resource links found by the quarterly sweep"
