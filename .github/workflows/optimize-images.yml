name: Optimize images
# Website tooling, largely written by AI (Claude) and checked for behaviour
# rather than wording. It describes how the site is built, not how the lab works;
# lab policy lives in _guide/. See accessibility.md, "How this site is made".

# When images land in assets/img/ (a push to main that touches them, or a manual
# run), compress any that are oversized and, if anything shrank, open a pull request
# with the smaller files. A human reviews and merges; nothing is republished
# without that review, same as the publications bot.
#
# Why a PR and not an auto-commit: it keeps the "bot proposes, human approves" flow,
# and lets you eyeball that a compressed photo still looks right before it ships.
on:
  pull_request:
    paths:
      - "assets/**"
  push:
    branches: [main]
    paths:
      - "assets/img/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # Blocks on pull requests. Compression used to run only after images reached
  # main, by which point deployment had already shipped them. This checks before
  # the merge, and changes nothing.
  #
  # Also covers video, GIFs and SVGs, which the compressor never rewrites.
  budget:
    name: Media budget
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: pip install Pillow
      - name: Check images, video and SVGs against the budget
        run: python scripts/optimize_images.py --check

  compress:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install Pillow

      - name: Compress oversized images
        run: python scripts/optimize_images.py

      - name: Open a pull request if anything shrank
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Compress oversized images"
          branch: bot/optimize-images
          title: "Compress oversized images"
          body: |
            Automated image compression: one or more images in `assets/img/` were
            over the size/width budget and have been shrunk in place.

            Please glance at the compressed versions to confirm they still look right,
            then merge. (Budget: max 1600px wide; ~300 KB JPEG / ~600 KB PNG.)
          labels: |
            images
            automation
