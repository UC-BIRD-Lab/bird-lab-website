name: Site checks
# Website tooling, largely written by AI (Claude) and checked for behaviour
# rather than wording. It describes how the site is built, not how the lab works;
# lab policy lives in _guide/. See accessibility.md, "How this site is made".

# Quality gate: builds the site, then checks for broken internal links and
# missing images (HTMLProofer) and runs an accessibility scan (pa11y-ci).
# Runs on pull requests and pushes to main, separately from deployment.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Use the exact gem versions in Gemfile.lock, so these checks test the same
# build deploy.yml publishes.
env:
  BUNDLE_FROZEN: "true"

jobs:
  # Seconds. Catches content that would build fine but publish something untrue:
  # a lead who isn't in people.yml, a DOI matching no paper, a missing photo.
  content:
    name: Content validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Check the content files
        run: python scripts/validate_content.py
      - name: Test the checker itself
        run: python scripts/test_validate_content.py

  build-and-check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so jekyll-last-modified-at reads real dates
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Check links & images (HTMLProofer)
        run: |
          gem install html-proofer
          # External links are skipped (they change/flake); we verify internal
          # links and that every referenced image actually exists.
          htmlproofer ./_site \
            --disable-external \
            --no-enforce-https \
            --allow-missing-href

  # This check BLOCKS. It was advisory until August 2026, when the site measured
  # clean and the suppression came off. Red means a real regression; fix it
  # rather than silencing it.
  #
  # Scanners cover roughly a third of WCAG AA. Green is a floor, not conformance;
  # the manual checks are in MAINTENANCE.md.
  accessibility:
    name: Accessibility (WCAG2AA)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so jekyll-last-modified-at reads real dates
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Build the page list from the sitemap
        # Generated, so a new page is covered the moment it exists.
        run: python3 scripts/build_pa11y_config.py

      - name: Run pa11y-ci (WCAG2AA)
        run: |
          set -euo pipefail
          # Pinned: unpinned, the scanner changes between runs and the check can
          # fail with no change to the site. Bump deliberately.
          npm install -g pa11y-ci@4.0.1 http-server@14.1.1

          http-server ./_site -p 4000 --silent &

          # Wait for a real response rather than guessing with `sleep`. If the
          # server never comes up, fail loudly: a scanner that ran zero pages
          # otherwise looks identical to one that found no problems.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/ >/dev/null; then
              echo "Server is up after ${i}s."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::http-server never became reachable; nothing was scanned."
              exit 1
            fi
            sleep 1
          done

          # Chrome's --no-sandbox flag (needed on the Ubuntu runner) is in
          # pa11y.settings.json.
          pa11y-ci --config ./pa11yci.generated.json
