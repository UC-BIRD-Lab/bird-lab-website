# Hand-curated extras for papers in publications.yml (which the OpenAlex bot
# manages and would overwrite). Entries match by bare DOI; all other fields
# optional:
#   data / code   links to the dataset and code
#   preprint      free author copy; "Preprint" pill
#   pdf           free PDF of the published version; "Open access" pill. Rarely
#                 needed: the bot fills `oa_url` in publications.yml, and `pdf:`
#                 here overrides it.
#   image         small figure; major papers only
#   kind          journal sub-type, "review" or "commentary" (default label
#                 "Research article")
#   award         honor for this paper; gold 🏆 pill
#   correction    link to a published correction; "Correction" pill (the bot
#                 skips corrections). `correction_label:` overrides the text.
# Nothing shows until the paper is on the Publications page. Press coverage
# goes in press.yml with the paper's `doi:`, not here.

