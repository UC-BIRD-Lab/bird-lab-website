# Join page: the Undergrad, Graduate and Postdoc cards plus the postings above
# them.
#   open: true    green "Now recruiting" pill + `open_note`
#   open: false   amber "Open via fellowship" pill + `closed_note`
#   (for undergrad the note text is the pill itself)
# To take a posting down set `enabled: false` under `featured:` or `second:`,
# then `enabled: false` in announcement.yml for the banner. join.md needs no
# edit. Keep pill text readable on its own, never colour-only.

# Pre-fills the "Email me" button.
email_body: |
  Hi Dr. Harvey,

  A bit about me: [program/year + one line of background].
  Why your lab: [a project or paper of yours that caught my eye].
  What I'd like to build or learn here: [...].
  Timing: [when I'd start]. My CV and unofficial transcript are attached.

# Featured posting. `body` paragraphs render in order (HTML, not Markdown, so
# use <strong>). The block hides itself after `deadline`. `flyer` is optional.
featured:
  enabled: true
  id: postdoctoral-scholar
  pill: Now hiring
  title: Postdoctoral Scholar
  deadline: 2026-09-30
  body:
    - >-
      A <strong>full-time, two-year position</strong> helping lead research at the
      Center for Animal Locomotion &amp; Innovation (CALI), our new shared facility
      with 57 synchronised motion-capture and high-speed cameras and a 70-foot
      flight hall. You'll lead original research in animal flight and biomechanics
      while shaping how we turn very large multi-camera datasets into new
      scientific measurements, and you'll coordinate experiments with falconers,
      veterinarians and visiting research teams.
    - >-
      We'd like to hear from candidates coming from <strong>either</strong> computer
      science, computer vision, machine learning or scientific computing,
      <strong>or</strong> animal locomotion, organismal biology, experimental
      biomechanics or high-speed imaging. You don't need to already span both.
      What matters most is scientific independence, collaborative leadership, and
      enthusiasm for fundamental research across disciplines.
  terms: >-
    Full-time · two years · Davis, California · UC salary scale and benefits.
    Applications are due by September 30, 2026.
  apply_subject: "Postdoctoral scholar application - BIRD Lab (UC Davis)"
  apply_cta: Email your application
  flyer: /assets/img/join/postdoctoral-scholar-flyer.png
  flyer_alt: >-
    Postdoctoral Scholar recruitment flyer. All details are in the text on this page.

# Second posting, same fields. `apply_url` replaces the email button.
second:
  enabled: true
  id: social-media-coordinator
  pill: Now hiring
  title: Social Media Coordinator
  deadline: 2026-09-30
  body:
    - >-
      A <strong>paid, part-time position</strong> supervised by Dr. Harvey and
      graduate student Alex Fillman: about four hours of focused time a month,
      producing informative posts about the lab's work, a monthly check-in, and
      support for the annual innovation fair.
    - >-
      We're looking for a student from a design or artistic background who is
      experienced with social media content, works independently and takes
      feedback well, and wants to communicate biological and engineering
      insights. You'll get regular feedback, a view of how biology and
      engineering meet in research, and practice in science communication.
  terms: >-
    Paid · part-time · about 4 hours a month. Applications are due by
    September 30, 2026; top applicants are contacted for interviews the
    following week.
  apply_url: https://forms.gle/G9ivAiD9EXggaPoB9
  apply_cta: Apply with the form
  flyer: /assets/img/join/social-media-coordinator-flyer.png
  flyer_alt: >-
    Social Media Coordinator recruitment flyer. All details are in the text on this page.

undergrad:
  open: true
  open_note: Interviewing most quarters
  closed_note: Not currently interviewing

graduate:
  open: false
  open_note: >-
    I have a funded opening for the coming cycle. If the lab looks like a fit,
    email me; early fall is the best time to reach out.
  closed_note: >-
    No funded openings at the moment. If you're interested, reach out and we can
    look at fellowship options together.

postdoc:
  open: true
  open_note: >-
    I'm recruiting a postdoctoral scholar to help lead research at CALI — see the
    full posting above. Applications are due September 30, 2026.
  closed_note: >-
    No funded openings at the moment. If you're interested, reach out and we can
    look at fellowship options together.
