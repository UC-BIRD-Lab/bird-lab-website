# CALI public recharge rates, in the UC Davis core-facility convention (one
# table, three affiliation tiers, effective date, approving office).
# For a rate change edit only this file: `effective:` (and `approved_by:` if
# needed), then the three amounts per service. Amounts are display strings,
# quoted, comma and cents as approved, no dollar sign (the page adds "$").
# Tier mapping to the approved schedule: internal = Base Rate 1 (subsidised),
# academic = External Rate 3, industry = External Rate 4.

effective: "July 1, 2026"
approved_by: "UC Davis Finance, Costing Policy & Analysis (CPA)"
unit: "per day"

# Columns, in display order after the service column.
tiers:
  - id: internal
    label: "UC Davis & UC"
  - id: academic
    label: "Non-UC & non-profit"
  - id: industry
    label: "Industry"

# One row per service.
services:
  - name: CALI-Basic
    desc: Non-animal studies
    rates: { internal: "909", academic: "1,378", industry: "1,514" }
  - name: CALI-Animal
    desc: Live-animal, trainer-supported
    rates: { internal: "2,621", academic: "3,970", industry: "4,363" }
  - name: CALI-Owner
    desc: Owner-provided animals (MOU)
    rates: { internal: "925", academic: "1,401", industry: "1,540" }
