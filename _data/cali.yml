# CALI (Center for Animal Locomotion and Innovation) data: lists and reused
# values only. The page's prose lives in cali.html; add something here only if
# it is a list or used in more than one place. This file, cali_rates.yml,
# cali_gallery.yml and cali.html are the movable "CALI unit".

name: Center for Animal Locomotion and Innovation

# Every "email us" link on the page.
contact_email: harvey@ucdavis.edu

# "Founded in …" on the page (opened 2026, funded 2024).
founded: 2026

# Images: paths only; alt text sits with each <img> in cali.html.
hero_photo: /assets/img/cali/cali-peregrine.jpg
facility_photo: /assets/img/cali/cali-cameras-upclose.jpg
# Backdrop for the closing call-to-action band.
team_photo: /assets/img/cali/cali-team.jpg

# Funding credit badge, also read by facilities.yml via `funding_key: cali`.
funding:
  note: "DURIP support from:"
  name: DEVCOM Army Research Laboratory
  logo: /assets/img/partners/arl.png
  url: https://www.arl.army.mil/

# Equipment. `specs` are the headline number tiles; `equipment` is the detail
# table beneath them. Model names use vendor spelling. Frame rates and
# accuracies are manufacturers' figures (a ceiling, not a promise).
specs:
  - { value: "44", label: "OptiTrack VersaX 120 motion-capture cameras" }
  - { value: "9", label: "high-speed Phantom cameras" }
  - { value: "4", label: "attached bird mews" }
  - { value: "2", label: "high-performance workstations" }

capabilities:
  - 3D motion capture + high-speed imaging
  - Sub-millimeter tracking
  - Controlled-environment hall
  - Daylight-balanced lighting

# `also:` (optional) is a second line under the same row label.
equipment:
  - label: Motion capture
    value: "44 × OptiTrack VersaX 120 — 12.6 MP (4096 × 3072), 300 fps"
  - label: Reference video
    value: "4 × OptiTrack Prime Color — 2 MP (1920 × 1080), 250 fps"
  - label: High-speed imaging
    value: "8 × Phantom VEO 440L — 4 MP (2560 × 1600), 1,100 fps at full resolution"
    also: "1 × Phantom VEO-E 340L — 4 MP (2560 × 1600), 800 fps at full resolution"
  - label: Lighting
    value: "14 × GSVITEC MultiLED MX — 50,000 lumen, controlled by GX8"
  - label: Reconstruction
    value: "2 × custom high-performance workstations"
  - label: Animal housing
    value: "4 attached mews"
  - label: Hall
    value: "70ft × 20ft hall, with security and monitoring systems"
  - label: Site
    value: "California Raptor Center, UC Davis"

# Team. Per person: name (required); group (must match team_groups);
