# ─────────────────────────────────────────────────────────────
#  CALI — Center for Animal Locomotion and Innovation
#
#  DATA ONLY. Everything in this file is a LIST or a REUSED VALUE:
#  people, equipment, partners, image paths, the contact address.
#
#  The page's sentences live in cali.html, next to the markup that
#  shows them — so changing a word is a normal edit to a paragraph,
#  not a hunt through YAML block scalars. Add something here only if
#  it repeats, is a list, or is used in more than one place.
#
#  This file plus cali_rates.yml, cali_gallery.yml, and cali.html are
#  the movable "CALI unit": if CALI ever spins out to its own site,
#  these move together with minimal rework.
#
#  YAML rules: two-space indents, a space after every colon.
# ─────────────────────────────────────────────────────────────

name: Center for Animal Locomotion and Innovation

# Used in six places on the page, so it lives here — change it once
# and every "email us" link follows. (If CALI ever moves to a shared
# inbox such as cali@ucdavis.edu, this is the only edit needed.)
contact_email: harvey@ucdavis.edu

# ── IMAGES ────────────────────────────────────────────────────
# Paths only; the alt text sits with each <img> in cali.html.
hero_photo: /assets/img/cali/cali-peregrine.jpg
facility_photo: /assets/img/cali/cali-cameras-upclose.jpg
# Backdrop for the closing call-to-action band.
team_photo: /assets/img/cali/cali-team.jpg

# Funding credit badge. The Facilities page reads this same block via
# `funding_key: cali` in _data/facilities.yml — edit it here only.
funding:
  note: "DURIP support from:"
  name: DEVCOM Army Research Laboratory
  logo: /assets/img/partners/arl.png
  url: https://www.arl.army.mil/

# ── EQUIPMENT ─────────────────────────────────────────────────
# `specs` are the four headline number tiles; `equipment` is the
# detail table beneath them. Model names use the vendors' own
# spelling so they are searchable.
#
# Frame rates and accuracies are the MANUFACTURERS' published
# figures. What a given experiment achieves depends on lens,
# resolution, capture volume, and lighting, so treat them as the
# ceiling rather than a promise. Correct any that don't match the
# hall's real configuration.
specs:
  - { value: "44", label: "OptiTrack VersaX 120 motion-capture cameras" }
  - { value: "9", label: "high-speed Phantom cameras" }
  - { value: "4", label: "attached bird mews" }
  - { value: "2", label: "high-performance workstations" }

capabilities:
  - 3D motion capture + high-speed imaging
  - Sub-millimeter tracking
  - Controlled-environment hall
  - Daylight-balanced lighting

# `also:` is optional — a second line under the same row label.
equipment:
  - label: Motion capture
    value: "44 × OptiTrack VersaX 120 — 12.6 MP (4096 × 3072), 300 fps"
  - label: Reference video
    value: "4 × OptiTrack Prime Color — 2 MP (1920 × 1080), 250 fps"
  - label: High-speed imaging
    value: "8 × Phantom VEO 440L — 4 MP (2560 × 1600), 1,100 fps at full resolution"
    also: "1 × Phantom VEO-E 340L — 4 MP (2560 × 1600), 800 fps at full resolution"
  - label: Lighting
    value: "14 × GSVITEC MultiLED MX — 50,000 lumen, controlled by GX8"
  - label: Reconstruction
    value: "2 × custom high-performance workstations"
  - label: Animal housing
    value: "4 attached mews"
  - label: Hall
    value: "70ft × 20ft hall, with security and monitoring systems"
  - label: Site
    value: "California Raptor Center, UC Davis"

# ── TEAM ──────────────────────────────────────────────────────
# To ADD A PERSON: copy one block under `team:` and fill it in.
#   name        required
#   group       which heading they appear under — must match a name
#               in team_groups below
#   institution short affiliation shown under the name (e.g. UC Davis, Oxford) —
#               this is what makes the consortium's multi-institution reach show
#   discipline  a short field shown as a colored tag (the transdisciplinary mix).
#               Colored styles exist for: Engineering, Veterinary Medicine,
#               Biology, Zoology, Neuroscience, Animation. A new discipline still
#               shows as a neutral tag — add a color in cali.html if you like.
#   photo       optional headshot (square JPG in assets/img/cali/ or people/);
#               no photo = a clean initials circle
#   website     optional — if set, their whole card links to it
#
# team_groups sets the heading order. The one-line description under
# each heading is in cali.html — if you add a group here, add its line
# there too (the page falls back to no description if you don't).
team_groups:
  - Directors
  - Advisors
  - Affiliates

