#   original in assets/img/people/_raw/ and run `bash scripts/apply-images.sh`.
#   No photo = initials avatar.
# Bird badge comes from `role` text (Postdoc 🦉 · PhD 🦢 · MSc 🦜 · Undergrad 🐥
#   · Visiting 🕊️ · PI 🦅); override with role_icon: "🦅".
# field (optional): discipline tag(s), comma-separated.
