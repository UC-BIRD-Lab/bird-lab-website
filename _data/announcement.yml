# Site-wide banner under the header (_includes/announcement-banner.html), for
# time-limited notices. `enabled: false` takes it down; it also hides itself
# after `deadline` (inclusive), both at build time and in main.js if the site
# has not been rebuilt. Visitor dismissals last the browser session, keyed by
# deadline. `url` is site-relative (baseurl added automatically).

