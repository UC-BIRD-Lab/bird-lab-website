# BIRD Lab (UC Davis) Jekyll configuration.

title: "BIRD Lab"
tagline: "Bio-Informed Research & Design"
description: >-
  The BIRD Lab at UC Davis studies how birds fly in order to build better
  aircraft. We identify fundamental biological principles of flight and refine
  them to improve engineered systems through bio-informed research.

# `url` is the origin only. Leave `baseurl` empty: the deploy workflow passes the
# project path ("/bird-lab-website") at build time, and an empty baseurl keeps
# the Site-checks link test passing.
url: "https://uc-bird-lab.github.io"
baseurl: ""

# Google Search Console; jekyll-seo-tag emits it as a <meta> tag on every page.
google_site_verification: L8d8KgsD07pwppyU9Jw4QpHmSsM_XuosM8-dVuAPsHw

lab:
  full_name: "Bio-Informed Research & Design Lab"
  institution: "University of California, Davis"
  pi: "Dr. Christina Harvey"
  pi_title: "Assistant Professor"          # search engines read this (schema.html)
  pi_email: "harvey@ucdavis.edu"
  founded: 2022                            # the "Founded" number on the home page
  department: "Mechanical &amp; Aerospace Engineering"
  address: "University of California, Davis · Davis, CA 95616"
  orcid: "0000-0002-2830-0844"
  scholar: "https://scholar.google.com/citations?hl=en&user=_uRCRPgAAAAJ"
  location: "Department of Mechanical & Aerospace Engineering, UC Davis, Davis, CA"
  # Links shown in the footer and Data & Code section.
  linkedin: "https://www.linkedin.com/in/Christina-A-Harvey"
  instagram: "https://www.instagram.com/ucdbirdlab_mae/"
  instagram_handle: "ucdbirdlab_mae"
  github_org: "https://github.com/UC-BIRD-Lab"
  # Data repository for published data/code.
  figshare_url: "https://figshare.com/authors/Christina_Harvey/4766004"

# Default social-share image (jekyll-seo-tag). Opaque 1200x630 card; the
# dimensions let previews reserve the right space.
image:
  path: /assets/img/og-image.png
  width: 1200
  height: 630

# Large summary card on X/Twitter.
twitter:
  card: summary_large_image

# Optional images; pages only render one when its path is set.
assets:
  # People-page group photo and the Home "In the field" band.
  lab_photo: "/assets/img/lab/CALIopening-photo-edited-2026.jpg"
  # "Lab culture" photo on the Join page.
  culture_photo: "/assets/img/lab/labphoto-silly-2024.jpg"

# Private member workspace (Notion).
member_portal_url: "https://app.notion.com/p/birdlab/Internal-Lab-Pages-6d6f4c7465a44de5a518a5a6786593f1"

# Undergraduate interest form
undergrad_form_url: "https://forms.gle/TsddkYBtYMH5zkt78"

# Cookieless analytics (GoatCounter).
analytics:
  goatcounter: "birdlab"


# Build settings
# Timezone for build-stamped dates (footer "Site updated", announcement and
# sign-up deadlines).
timezone: America/Los_Angeles
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
permalink: pretty
sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-last-modified-at   # per-page "Last updated" date, from git history

# Lab guide category order, read by the guide landing page and wiki sidebar.
# Add new categories here (the landing page warns if you forget).
guide_order:
  - Getting Started
  - Communication & Culture
  - Working in the Lab
  - Research Workflow
  - Writing & Dissemination
  - Professional Development

# Collections
collections:
  guide:
    output: true
    permalink: /lab-guide/:name/

defaults:
  - scope: { path: "", type: "guide" }
    values: { layout: "wiki" }
  - scope: { path: "" }
    values: { layout: "page" }

exclude:
  - README.md
  - MAINTENANCE.md
  - ARCHITECTURE.md
  - CONTENT-GUIDE.md
  - CONTRIBUTING.md
  - scripts/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .github/
  - pa11y.settings.json
  - pa11yci.generated.json
  - AUTOMATION.md
  - serve.sh
  - bird-lab-website.Rproj
  # FUSE / editor-sync leftovers carry stale front matter (a missing category
  # shows as a blank card on the Lab Guide hub).
  - ".fuse_hidden*"
  - "_guide/.fuse_hidden*"
