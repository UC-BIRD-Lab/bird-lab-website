{%- comment -%} schema.org JSON-LD for the lab and PI, built from _config.yml. {%- endcomment -%}
{%- assign base = site.url | append: site.baseurl -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "ResearchOrganization",
      "@id": "{{ base }}/#lab",
      "name": {{ site.lab.full_name | jsonify }},
      "alternateName": {{ site.title | jsonify }},
      "url": "{{ base }}/",
      "description": {{ site.description | strip_newlines | jsonify }},
      "logo": "{{ base }}/assets/img/logo_whiteshading.png",
      "parentOrganization": { "@type": "CollegeOrUniversity", "name": {{ site.lab.institution | jsonify }} }
    },
    {
      "@type": "Person",
      "@id": "{{ base }}/#pi",
      "name": {{ site.lab.pi | remove: "Dr. " | jsonify }},
      "honorificPrefix": "Dr.",
      "jobTitle": {{ site.lab.pi_title | jsonify }},
      "email": "mailto:{{ site.lab.pi_email }}",
      "affiliation": { "@type": "CollegeOrUniversity", "name": {{ site.lab.institution | jsonify }} },
      "worksFor": { "@id": "{{ base }}/#lab" },
      "url": "{{ base }}/people/",
      "sameAs": [
        "https://orcid.org/{{ site.lab.orcid }}",
        {{ site.lab.scholar | jsonify }},
        {{ site.lab.linkedin | jsonify }},
        {{ site.lab.github_org | jsonify }}
      ]
    }
  ]
}
</script>
