{%- comment -%} GoatCounter (cookieless; see /privacy/). Renders nothing unless `analytics.goatcounter` is set in _config.yml. {%- endcomment -%}
{%- if site.analytics.goatcounter and site.analytics.goatcounter != "" -%}
<script data-goatcounter="https://{{ site.analytics.goatcounter }}.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
{%- endif -%}
