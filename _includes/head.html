<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14284f">
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}?v=7" sizes="any">
<link rel="icon" href="{{ '/assets/img/favicon.png' | relative_url }}?v=7" type="image/png">
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}?v=7">
<link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">

{% seo %}

{% include schema.html %}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap">
{%- comment -%} ?v= build time busts caches on every deploy. {%- endcomment -%}
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="alternate" type="application/atom+xml" title="BIRD Lab news" href="{{ '/feed.xml' | relative_url }}">

{%- comment -%} MathJax, only on pages with `math: true`. {%- endcomment -%}
{%- if page.math -%}
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    messageStyle: "none",
    "HTML-CSS": { availableFonts: ["TeX"], preferredFont: "TeX", scale: 95 }
  });
</script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML"></script>
{%- endif -%}
